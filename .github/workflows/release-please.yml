name: Release Please

on:
  push:
    branches: [main]

# Every job states the permissions it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release created with GITHUB_TOKEN does not trigger the `release`
  # event, so the image workflow is called directly.
  release-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-images.yml
    # What release-images.yml needs: pushing and signing the image (keyless,
    # through the OIDC token), and attaching the SBOM to the release.
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
