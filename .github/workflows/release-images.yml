name: Release Images

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  release:
    types: [published]

# Every job states the permissions it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/cec2mqtt
  TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  build-push-sign:
    name: Build, push, sign and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing with cosign uses the OIDC token.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # TAG_NAME is vX.Y.Z; the semver patterns publish X.Y.Z, X.Y and X.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}},value=${{ env.TAG_NAME }},enable=${{ !startsWith(env.TAG_NAME, 'v0.') }}
            type=raw,value=latest

      # The Dockerfile cross compiles with xx, so no QEMU is needed.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Prepare SBOM metadata
        id: sbom
        run: |
          IMAGE_REF="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          SBOM_FILE="sbom-cec2mqtt-${{ env.TAG_NAME }}.spdx.json"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "sbom_file=$SBOM_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM file (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.sbom.outputs.image_ref }}
          format: spdx-json
          output: ${{ steps.sbom.outputs.sbom_file }}

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.sbom.outputs.image_ref }}"

      - name: Attest SBOM (keyless)
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate "${{ steps.sbom.outputs.sbom_file }}" \
            "${{ steps.sbom.outputs.image_ref }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ steps.sbom.outputs.sbom_file }}
          if-no-files-found: error

  publish-release-assets:
    name: Publish SBOM release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-push-sign

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sbom-assets

      - name: Attach SBOM files to GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: sbom-assets/**/*.spdx.json
