name: Release Images

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/cec2mqtt
  TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  build-push-sign:
    name: Build, push, sign and SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # TAG_NAME is vX.Y.Z; the semver patterns publish X.Y.Z, X.Y and X.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}},value=${{ env.TAG_NAME }},enable=${{ !startsWith(env.TAG_NAME, 'v0.') }}
            type=raw,value=latest

      # The Dockerfile cross compiles with xx, so no QEMU is needed.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Prepare SBOM metadata
        id: sbom
        run: |
          IMAGE_REF="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          SBOM_FILE="sbom-cec2mqtt-${{ env.TAG_NAME }}.spdx.json"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "sbom_file=$SBOM_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM file (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.sbom.outputs.image_ref }}
          format: spdx-json
          output: ${{ steps.sbom.outputs.sbom_file }}

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.sbom.outputs.image_ref }}"

      - name: Attest SBOM (keyless)
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate "${{ steps.sbom.outputs.sbom_file }}" \
            "${{ steps.sbom.outputs.image_ref }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ${{ steps.sbom.outputs.sbom_file }}
          if-no-files-found: error

  publish-release-assets:
    name: Publish SBOM release assets
    runs-on: ubuntu-latest
    needs: build-push-sign

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          path: sbom-assets

      - name: Attach SBOM files to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: sbom-assets/**/*.spdx.json
