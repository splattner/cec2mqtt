name: Set up Go with libcec
description: Installs the libcec headers, which the cgo bindings in internal/gocec need, and the Go version from go.mod.

runs:
  using: composite
  steps:
    - name: Install libcec
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcec-dev libp8-platform-dev libudev-dev

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache: true
