<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">cec2mqtt project banner</title><desc id="desc">HDMI-CEC devices connected through the cec2mqtt bridge to MQTT and Home Assistant</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071425"/><stop offset=".52" stop-color="#0b1d32"/><stop offset="1" stop-color="#092b39"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#29d6e7"/><stop offset="1" stop-color="#76e8a0"/></linearGradient>
 <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a3f59"/><stop offset="1" stop-color="#133043"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#17d5b9" stop-opacity=".15"/><stop offset="1" stop-color="#17d5b9" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7aaac0" opacity=".13"/></pattern>
 <filter id="shadow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
</defs>
<rect width="1600" height="640" fill="url(#bg)"/><rect width="1600" height="640" fill="url(#dots)"/><circle cx="1215" cy="370" r="455" fill="url(#glow)"/><path d="M0 585 C350 475 570 695 930 575 S1440 495 1600 535" fill="none" stroke="#3fd7dd" stroke-width="1.4" opacity=".12"/>
<!-- headline -->
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="110" y="160" fill="#f3fbff" font-size="86" font-weight="800" letter-spacing="-4">cec<tspan fill="#38d8d7">2</tspan>mqtt</text><rect x="111" y="186" rx="3" width="86" height="6" fill="url(#accent)"/><text x="110" y="244" fill="#b3cbd9" font-size="26" font-weight="450">Bridge HDMI-CEC to MQTT</text><text x="110" y="287" fill="#7798ad" font-size="20">Control your entertainment devices from your smart home.</text></g>
<!-- Pipeline centerline -->
<path d="M310 459 H1285" stroke="#1b4f65" stroke-width="5" stroke-linecap="round"/><path d="M310 459 H1285" stroke="url(#accent)" stroke-width="3" stroke-dasharray="5 14" opacity=".8"/>
<!-- TV block -->
<g filter="url(#shadow)"><rect x="110" y="350" width="285" height="219" rx="23" fill="#10283b" stroke="#2a5268" stroke-width="2"/></g>
<rect x="159" y="382" width="188" height="112" rx="12" fill="#071321" stroke="#4b8196" stroke-width="5"/><path d="M178 463 L222 422 L265 453 L324 408" fill="none" stroke="#2fd7d5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".7"/><circle cx="324" cy="408" r="6" fill="#75ecb0"/><path d="M253 496 v14 m-32 0 h64" stroke="#789aaa" stroke-width="5" stroke-linecap="round"/><text x="252" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e8f7ff">HDMI-CEC</text>
<!-- connector -->
<g><rect x="435" y="440" width="180" height="38" rx="19" fill="#0a2535" stroke="#266575"/><text x="525" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#82e4e4" letter-spacing="2">CONTROL</text></g>
<!-- bridge block -->
<g filter="url(#shadow)"><rect x="640" y="350" width="282" height="219" rx="23" fill="url(#bridge)" stroke="#3bd8d7" stroke-width="2.5"/></g>
<rect x="670" y="373" width="222" height="10" rx="5" fill="url(#accent)" opacity=".8"/>
<g transform="translate(739 409)" stroke="#bbf9ed" stroke-width="4" fill="none" stroke-linejoin="round"><rect x="0" y="0" width="82" height="66" rx="13"/><path d="M-10 16 H0 M-10 33 H0 M-10 50 H0 M82 16 H92 M82 33 H92 M82 50 H92 M21 -10 V0 M41 -10 V0 M61 -10 V0 M21 66 V76 M41 66 V76 M61 66 V76"/><path d="M26 34 l11 11 23-24" stroke="#62e8ae" stroke-width="5" stroke-linecap="round"/></g>
<text x="781" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#f0ffff">cec2mqtt</text>
<!-- MQTT block -->
<g filter="url(#shadow)"><rect x="972" y="350" width="250" height="219" rx="23" fill="#10283b" stroke="#2a5268" stroke-width="2"/></g>
<g transform="translate(1097 429)" stroke="#73e6b5" stroke-width="4" fill="none"><circle r="12" fill="#73e6b5" stroke="none"/><circle cx="-55" cy="-31" r="10"/><circle cx="55" cy="-31" r="10"/><circle cx="-55" cy="42" r="10"/><circle cx="55" cy="42" r="10"/><path d="M-45 -26 L-10 -6 M45 -26 L10 -6 M-45 36 L-10 6 M45 36 L10 6" stroke-linecap="round"/></g><text x="1097" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#f0ffff">MQTT</text>
<!-- HA endpoint -->
<g filter="url(#shadow)"><rect x="1273" y="350" width="220" height="219" rx="23" fill="#10283b" stroke="#2a5268" stroke-width="2"/></g>
<g transform="translate(1383 426)" fill="none" stroke="#54c9fa" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M-45 -5 L0 -47 L45 -5 V45 H-45 Z"/><circle cx="0" cy="-12" r="6" fill="#54c9fa" stroke="none"/><circle cx="-25" cy="17" r="6" fill="#54c9fa" stroke="none"/><circle cx="25" cy="17" r="6" fill="#54c9fa" stroke="none"/><path d="M0 -6 V13 M-25 17 H25"/></g><text x="1383" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="750" fill="#f0ffff">Home Assistant</text><text x="1383" y="547" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#80a9c0">AUTO DISCOVERY</text>
<!-- floating capability chips -->
<g font-family="Arial,sans-serif" font-size="17" font-weight="650"><rect x="760" y="214" width="145" height="43" rx="21" fill="#123342" stroke="#326979"/><circle cx="785" cy="235" r="6" fill="#62e8ae"/><text x="802" y="241" fill="#c7e8ec">Power</text><rect x="923" y="214" width="155" height="43" rx="21" fill="#123342" stroke="#326979"/><circle cx="946" cy="235" r="6" fill="#62e8ae"/><text x="962" y="241" fill="#c7e8ec">Volume</text><rect x="1095" y="214" width="157" height="43" rx="21" fill="#123342" stroke="#326979"/><circle cx="1118" cy="235" r="6" fill="#62e8ae"/><text x="1135" y="241" fill="#c7e8ec">Sources</text><rect x="1270" y="214" width="196" height="43" rx="21" fill="#123342" stroke="#326979"/><circle cx="1293" cy="235" r="6" fill="#62e8ae"/><text x="1310" y="241" fill="#c7e8ec">Remote keys</text></g>
</svg>
