version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - nolintlint
    - perfsprint
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Reports the code cgo generates for every C call in the bindings.
      - path: internal/gocec/
        linters: [gocritic]
        text: dupSubExpr
      # Tests write temporary files, and use fixed inputs.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/splattner/cec2mqtt
